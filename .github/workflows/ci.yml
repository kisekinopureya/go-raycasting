name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .github/commitlint.config.mjs

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install SDL2 dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev \
            libsdl2-image-dev

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build Go-Raycasting
        run: |
          mkdir -p dist

          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=0 \
          go build \
            -ldflags="-s -w" \
            -o dist/go-raycasting-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Build level editor
        run: |
          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=1 \
          go build \
            -ldflags="-s -w" \
            -o dist/leveleditor-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/leveleditor

      - uses: actions/upload-artifact@v4
        with:
          name: go-raycasting-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/go-raycasting-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/leveleditor-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [commitlint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: go-raycasting-linux-amd64
          path: dist

      - name: Mark binary executable
        run: |
          chmod +x dist/go-raycasting-linux-amd64
          chmod +x dist/leveleditor-linux-amd64

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/go-raycasting-linux-amd64
            dist/leveleditor-linux-amd64
          generate_release_notes: true
